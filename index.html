
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaBooks</title>
    <style>
        :root {
            --bg: #F6F9F7;
            --surface: #FFFFFF;
            --fg: #1A2320;
            --fg-2: #2D3A32;
            --muted: #6B7A70;
            --meta: #8A9B90;
            --border: #E2E8E4;
            --border-soft: #EDF1EE;
            --accent: #6B9071;
            --accent-on: #FFFFFF;
            --accent-hover: color-mix(in oklab, #6B9071, black 10%);
            --accent-active: color-mix(in oklab, #6B9071, black 16%);
            --accent-soft: color-mix(in oklab, #6B9071 14%, transparent);
            --success: #17A34A;
            --warn: #EAB308;
            --danger: #DC2626;
            --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
            --font-body: 'Inter Variable', -apple-system, system-ui, sans-serif;
            --font-mono: ui-monospace, 'JetBrains Mono', monospace;
            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 15px;
            --text-lg: 18px;
            --text-xl: 24px;
            --text-2xl: 32px;
            --text-3xl: 44px;
            --leading-body: 1.6;
            --leading-tight: 1.25;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-pill: 9999px;
            --elev-flat: none;
            --elev-raised: 0 2px 12px color-mix(in oklab, #1A2320, transparent 94%);
            --elev-overlay: 0 8px 30px color-mix(in oklab, #1A2320, transparent 90%);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-display {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .font-mono {
            font-family: var(--font-mono);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        .bg-page { background-color: var(--bg); }
        .bg-surface { background-color: var(--surface); }
        .bg-accent { background-color: var(--accent); }
        .bg-accent-soft { background-color: var(--accent-soft); }
        .bg-accent-hover { background-color: var(--accent-hover); }
        .text-fg { color: var(--fg); }
        .text-muted { color: var(--muted); }
        .text-accent { color: var(--accent); }
        .text-accent-on { color: var(--accent-on); }
        .border-default { border-color: var(--border); }
        .border-accent { border-color: var(--accent); }
        .shadow-card { box-shadow: var(--elev-raised); }
        .radius-card { border-radius: var(--radius-lg); }
        .text-danger { color: var(--danger); }
        .border-danger { border-color: var(--danger); }
        .bg-danger { background-color: var(--danger); }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
